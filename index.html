<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web Multi Player html">
    <meta name="title" content="Multi Player">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/custom-scrollbar.css">
    <link rel="icon" type="image/x-icon" href="https://rab-8.github.io/images/SRB-8.png">
  <title>গুরুত্বপূর্ণ লিংক সমূহ</title>
  <style>
    :root { --page-bg: #f3f9fc; --text: #123b61; }
    * { box-sizing: border-box; }
    body {
      background-image: url('https://rab-8.github.io/images/SRB-1.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      margin: 0;
      height: 100vh;
      margin: 0; padding: 26px;
    }
    .board {
      max-width: 1600px; margin: 0 auto; padding: 0 0 28px;
      border-radius: 28px; background: rgba(255,255,255,.58);
      box-shadow: 0 12px 35px rgba(24,72,100,.09);
      overflow: hidden;
    }
    .hero {
      min-height: 174px; margin: 0 0 24px; padding: 24px 28px;
      border-radius: 26px;
      background: linear-gradient(110deg, #0876c9 0%, #00a9a9 54%, #3fc95e 100%);
      color: yellow; text-align: center; position: relative;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 7px 18px rgba(0,112,153,.16);
    }
    .hero h1 { margin: 0; font-size: clamp(29px, 4vw, 58px); font-family: 'khalid-bin-olid';
    font-weight: normal; line-height: 1.35; }
    .hero p { margin: 8px 0 0; font-size: clamp(15px, 1.7vw, 25px); font-family: solaiman-lipi; }
    .hero .chain { font-size: .86em; margin-right: 14px; }
    .hero .spark { position: absolute; right: 5%; top: 28%; font-size: 56px; opacity: .8; transform: rotate(12deg); }
    .cards {
      padding: 0 28px; display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 30px;
    }
    .card {
      --accent: #087bd3; --pale: #e3f3ff; --edge: #a9dcff; --ink: #0755a7;
      min-height: 226px; padding: 22px 20px; border: 2px solid var(--edge);
      border-radius: 25px; position: relative; overflow: hidden;
      background: linear-gradient(115deg, var(--pale), rgba(255,255,255,.84));
      ackground-color: rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(3px);
      box-shadow: 0 5px 10px rgba(32,76,110,.09);
      transition: transform .2s ease, box-shadow .2s ease;
      display: flex; flex-direction: column; justify-content: space-between;
      text-decoration: none; color: inherit;
    }
    .card::before {
      content: ""; position: absolute; width: 58%; height: 55%;
      left: -5%; bottom: -28%; border-radius: 50% 50% 0 0;
      background: var(--edge); opacity: .52; pointer-events: none;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 22px rgba(32,76,110,.14); }
    .card-top { display: flex; gap: 18px; align-items: center; position: relative; z-index: 1; }
    .icon-wrap {
      flex: 0 0 106px; width: 106px; height: 106px; border-radius: 50%;
      display: grid; place-items: center; color: white;
      background: linear-gradient(145deg, var(--accent), var(--ink));
    }
    .card-icon { width: 80px; height: 80px; object-fit: contain; display: block; }
    .card-content { min-width: 0; flex: 1; }
    .card h2 { color: var(--ink); margin: 0 0 8px; font-size: clamp(23px, 2.1vw, 36px); font-family: solaiman-lipi; line-height: 1.25; font-weight: 800; }
    .url {
      display: block; padding: 10px 13px; border-radius: 30px;
      background: rgba(255,255,255,.74); border: 1px solid rgba(255,255,255,.9);
      color: #164f7c; font-family: Arial, sans-serif; font-size: clamp(12px, 1.18vw, 18px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; visibility: hidden;
    }
    .url .link-symbol { font-size: 1.15em; margin-right: 8px; }
    .card-bottom { font-family: solaiman-lipi; display: flex; justify-content: flex-end; position: relative; z-index: 1; margin-top: 18px; }
    .visit {
      border-radius: 30px; background: linear-gradient(100deg, var(--accent), var(--ink));
      color: #fff; padding: 11px 24px; font-size: 20px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 12px;
      box-shadow: 0 3px 7px rgba(0,0,0,.06);
    }
    .visit .arrow { font-family: Arial, sans-serif; font-size: 25px; line-height: 1; }
    .coral { --accent:#ff5365; --pale:#fff0f2; --edge:#ffc6ce; --ink:#b30d39; }
    .blue { --accent:#087ee1; --pale:#e6f4ff; --edge:#a8dfff; --ink:#0750a5; }
    .green { --accent:#05a94f; --pale:#e8ffed; --edge:#b8f1c6; --ink:#08743d; }
    .purple { --accent:#6c3ce8; --pale:#f0eaff; --edge:#d2c2ff; --ink:#4a22b9; }
    .orange { --accent:#f47a00; --pale:#fff4df; --edge:#ffdc8c; --ink:#b94700; }
    .teal { --accent:#08a0b4; --pale:#e2fbfc; --edge:#a0e9ee; --ink:#00778d; }
    .royal { --accent:#3267ee; --pale:#eaf0ff; --edge:#b8d0ff; --ink:#1745b5; }
    .pink { --accent:#e62e85; --pale:#fff0f7; --edge:#ffc5e0; --ink:#bd1262; }
    .violet { --accent:#6738d7; --pale:#f0ebff; --edge:#d0c0ff; --ink:#4b22b4; }
    @media (max-width: 1050px) {
      body { padding: 16px; }
      .cards { grid-template-columns: repeat(2, minmax(0,1fr)); padding: 0 18px; gap: 18px; }
      .card { min-height: 205px; padding: 18px; }
      .icon-wrap { flex-basis: 78px; width: 78px; height: 78px; }
      .card-icon { width: 42px; height: 42px; }
      .hero .spark { display: none; }
    }
    @media (max-width: 620px) {
      body { padding: 10px; }
      .board { border-radius: 20px; padding-bottom: 16px; }
      .hero { min-height: 140px; border-radius: 19px; margin-bottom: 16px; padding: 20px 12px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 14px; line-height: 1.6; }
      .hero .chain { margin-right: 7px; }
      .cards { grid-template-columns: 1fr; padding: 0 12px; gap: 14px; }
      .card { min-height: 176px; padding: 17px 15px; border-radius: 20px; }
      .card-top { gap: 13px; }
      .icon-wrap { flex-basis: 68px; width: 68px; height: 68px; }
      .card-icon { width: 36px; height: 36px; }
      .card h2 { font-size: 25px; margin-bottom: 7px; }
      .url { font-size: 12px; padding: 9px 10px; }
      .card-bottom { margin-top: 13px; }
      .visit { font-size: 16px; padding: 9px 17px; }
      .visit .arrow { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="board">
    <header class="hero">
      <h1><span class="chain">🔗</span>গুরুত্বপূর্ণ লিংক সমূহ</h1>
      <p>প্রয়োজনীয় সাইটগুলোতে দ্রুত যেতে নিচের লিংকগুলোতে ক্লিক করুন</p>
      <span class="spark" aria-hidden="true">♡</span>
    </header>
    <section class="cards" id="linkCards" aria-label="গুরুত্বপূর্ণ লিংক">
      <!-- কার্ডগুলো নিচের JavaScript-এর links তালিকা থেকে তৈরি হবে। -->
    </section>
  </main>

  <script>
    /*
      নিজের প্রয়োজন অনুযায়ী শুধু এই তালিকাটি পরিবর্তন করুন।
      title = কার্ডের নাম, url = গন্তব্য লিংক, icon = icons তালিকার ছবির নাম, theme = কার্ডের রং।
      theme-এর অনুমোদিত মান: coral, blue, green, purple, orange, teal, royal, pink, violet
      অন্য ব্যবহারকারীর জন্য ওয়েবপেজে কোনো সম্পাদনা অপশন দেখানো হয় না।
    */
    const links = [
      { title: "বকেয়া রেশন ক্যালকুলেটর", url: "https://masumbillah6778.github.io/rab/online-data-storage-v9/", theme: "coral", icon: "home" },
      { title: "বয়স নির্ণয়কারী ক্যালকুলেটরে", url: "https://masumbillah6778.github.io/srb-8-phonebook/index.html", theme: "blue", icon: "dashboard" },
      { title: "আপডেট চলছে", url: "#", theme: "green", icon: "search" },
      { title: "আপডেট চলছে", url: "#", theme: "purple", icon: "settings" },
      { title: "আপডেট চলছে", url: "#", theme: "orange", icon: "users" },
      { title: "আপডেট চলছে", url: "#", theme: "teal", icon: "download" },
      { title: "আপডেট চলছে", url: "#", theme: "royal", icon: "globe" },
      { title: "আপডেট চলছে", url: "#", theme: "pink", icon: "mail" },
      { title: "যোগাযোগ করুন", url: "tel:+8801754604359", theme: "violet", icon: "phone" }
    ];

    // প্রতিটি আইকনের সরাসরি ছবির লিংক দিন (PNG, JPG, WEBP ইত্যাদি)।
    // নিচের example.com লিংকগুলো নমুনা—নিজের ছবির URL দিয়ে বদলে দিন।
    const icons = {
      home: "https://rab-8.github.io/images/SRB-8.png",
      dashboard: "https://rab-8.github.io/images/SRB-8.png",
      search: "https://example.com/search.png",
      settings: "https://example.com/settings.png",
      users: "https://example.com/users.png",
      download: "https://example.com/download.png",
      globe: "https://example.com/globe.png",
      mail: "https://example.com/mail.png",
      phone: "https://rab-8.github.io/images/call.png"
    };

    const container = document.getElementById("linkCards");
    links.forEach(item => {
      const card = document.createElement("a");
      card.className = `card ${item.theme || "blue"}`;
      card.href = item.url;
      card.target = item.url.startsWith("http") ? "_blank" : "_self";
      if (item.url.startsWith("http")) card.rel = "noopener noreferrer";
      card.setAttribute("aria-label", `${item.title} খুলুন`);
      const iconUrl = icons[item.icon] || icons.globe;
      card.innerHTML = `
        <div class="card-top">
          <div class="icon-wrap" aria-hidden="true">
            <img class="card-icon" src="" alt="" loading="lazy">
          </div>
          <div class="card-content">
            <h2></h2>
            <span class="url"><span class="link-symbol">🔗</span><span class="url-text"></span></span>
          </div>
        </div>
        <div class="card-bottom"><span class="visit">সাইটে যান <span class="arrow">→</span></span></div>`;
      card.querySelector(".card-icon").src = iconUrl;
      card.querySelector("h2").textContent = item.title;
      card.querySelector(".url-text").textContent = item.url.replace(/^https?:\/\//, "");
      container.appendChild(card);
    });
  </script>
</body>
</html>
